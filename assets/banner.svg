<svg width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1500" height="500" fill="#000000"/>

  <!-- Left Side: Crystal Ball / Eye Logo -->
  <g transform="translate(200, 250)">
    <!-- Outer circular container -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#8b5cf6" stroke-width="3"/>

    <!-- Inner crystal ball structure -->
    <circle cx="0" cy="0" r="80" fill="#0a0a0f" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>

    <!-- Eye shape -->
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Iris -->
    <circle cx="0" cy="0" r="25" fill="#8b5cf6" opacity="0.3"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="15" fill="#8b5cf6"/>

    <!-- Data streams - left -->
    <path d="M -80,-60 L -100,-80 L -110,-90" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="-110" cy="-90" r="3" fill="#8b5cf6"/>

    <path d="M -70,0 L -90,0 L -105,0" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="-105" cy="0" r="3" fill="#8b5cf6"/>

    <path d="M -80,60 L -100,80 L -110,90" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="-110" cy="90" r="3" fill="#8b5cf6"/>

    <!-- Data streams - right -->
    <path d="M 80,-60 L 100,-80 L 110,-90" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="110" cy="-90" r="3" fill="#8b5cf6"/>

    <path d="M 70,0 L 90,0 L 105,0" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="105" cy="0" r="3" fill="#8b5cf6"/>

    <path d="M 80,60 L 100,80 L 110,90" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="110" cy="90" r="3" fill="#8b5cf6"/>

    <!-- Data streams - top -->
    <path d="M 0,-85 L 0,-100 L 0,-115" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="0" cy="-115" r="3" fill="#8b5cf6"/>

    <!-- Data streams - bottom -->
    <path d="M 0,85 L 0,100 L 0,115" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="0" cy="115" r="3" fill="#8b5cf6"/>
  </g>

  <!-- Right Side: Text Content -->
  <g transform="translate(500, 180)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#8b5cf6">
      ORACLE
    </text>

    <!-- Subtitle -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#9ca3af" letter-spacing="4">
      PREDICTIVE CONTEXT PRE-LOADER
    </text>

    <!-- Description -->
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#6b7280">
      Predict what context you'll need before you ask for it
    </text>
  </g>

  <!-- Version Badge (bottom right area) -->
  <g transform="translate(1320, 430)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#8b5cf6" text-anchor="middle">
      v1.0
    </text>
  </g>
</svg>
